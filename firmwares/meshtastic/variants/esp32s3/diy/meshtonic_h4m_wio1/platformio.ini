; Meshtonic H4M Companion v2 — WIO1-first custom Meshtastic port
; XIAO ESP32-S3 Plus carrier, MCP23017 radio GPIO expander, TCA9548A sensor mux
[env:meshtonic-h4m-wio1]
extends = esp32s3_base
board = meshtonic_h4m_wio1
board_level = extra
board_build.partitions = default_16MB.csv
upload_protocol = esptool
upload_speed = 921600

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D MESHTONIC_H4M=1
  -D MESHTONIC_H4M_MCP_RADIO=1
  -I variants/esp32s3/diy/meshtonic_h4m_wio1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D RADIOLIB_SPI_PARANOID=0
  -D MAP_TILES_GREY
  -D RAM_SIZE=1432
  -D STBI_ARENA_SIZE=450000
  -D LV_CACHE_DEF_SIZE=0
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D HAS_TFT=1
  -D HAS_SCREEN=1
  -D HAS_GPS=1
  -D USE_SX1262=1
  -D DISPLAY_SET_RESOLUTION
  -D DISPLAY_SIZE=240x320
  -D SPI_FREQUENCY=40000000
  -D VIEW_240x320

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<mesh/meshtonic/>

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21
